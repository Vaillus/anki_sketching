<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice — Anki Sketching</title>
    <link rel="stylesheet" href="/static/css/practice.css">
</head>
<body data-view="grid">

    <div id="practice-header">
        <a href="/editor" id="nav-editor-btn">← Editor</a>
        <button id="practice-back-btn" type="button">← Back</button>
        <h1>Practice</h1>
        <span id="practice-count"></span>
        <button id="practice-refresh" type="button" title="Rafraîchir">↺</button>
    </div>

    <div id="practice-main">
        <div id="practice-left">
            <div id="tag-filter"></div>
            <div id="due-cards-grid"></div>
        </div>
        <div id="practice-right">
            Sélectionne une carte
        </div>
    </div>

    <script>window.MAX_INTERVAL = {{ max_interval }};</script>
    <script src="/static/js/practice/main.js"></script>
</body>
</html>
